services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: portfolio-frontend

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true

    restart: unless-stopped